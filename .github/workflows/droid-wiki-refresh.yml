# factory-automation: 81d9789d-7b14-45f4-84d6-8ed42c8ac926
name: Droid Wiki Refresh
"on":
  workflow_dispatch: {}
  pull_request:
    types:
      - opened
      - synchronize
      - ready_for_review
  push:
    branches:
      - test
jobs:
  wiki-refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Factory Droid
        run: curl -fsSL https://app.factory.ai/cli | sh
      - name: Generate wiki
        run: droid exec --auto medium "/wiki --test"
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
