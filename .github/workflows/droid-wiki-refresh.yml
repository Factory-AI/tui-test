# factory-automation: d26f05b7-25b0-47fa-8338-0c5e7d2f79eb
name: Droid Wiki Refresh
"on":
  workflow_dispatch: {}
  pull_request:
    types:
      - opened
      - synchronize
      - ready_for_review
jobs:
  wiki-refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Factory Droid
        run: curl -fsSL https://app.factory.ai/cli | sh
      - name: Generate wiki
        run: droid exec --auto high -m auto "/wiki"
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
