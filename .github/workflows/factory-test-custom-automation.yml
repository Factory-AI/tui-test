name: Test Custom Automation
"on":
  workflow_dispatch: {}
  pull_request:
    types:
      - opened
permissions:
  contents: read
  pull-requests: write
  issues: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run Factory droid-action
        uses: Factory-AI/droid-action@main
        with:
          org_id: ${{ secrets.FACTORY_ORG_ID }}
          api_key: ${{ secrets.FACTORY_API_KEY }}
          prompt: lalalala this is a test
