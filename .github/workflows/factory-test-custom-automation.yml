# factory-automation: 9cf9a261-a3fe-49b4-8f15-940d708cb1a9
name: Test Custom Automation
"on":
  workflow_dispatch: {}
  pull_request:
    types:
      - opened
permissions:
  contents: read
  pull-requests: write
  issues: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run Factory droid-action
        uses: Factory-AI/droid-action@main
        with:
          org_id: ${{ secrets.FACTORY_ORG_ID }}
          api_key: ${{ secrets.FACTORY_API_KEY }}
          prompt: This is a test
