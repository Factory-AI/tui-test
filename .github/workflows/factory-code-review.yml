# factory-automation: 624a55d8-6776-4dd7-9daa-be5a5368f808
name: Code review
"on":
  workflow_dispatch: {}
  pull_request:
    types:
      - opened
permissions:
  contents: read
  pull-requests: write
  issues: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run Factory droid-action
        uses: Factory-AI/droid-action@main
        with:
          org_id: ${{ secrets.FACTORY_ORG_ID }}
          api_key: ${{ secrets.FACTORY_API_KEY }}
          automatic_review: true
          automatic_security_review: true
          prompt: Automatic code review with security review enabled on pull requests.
